site_name: Faith Njuguna | Technical Writer

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true       

nav:
  - Home: index.md
  - Projects:
       - InSight clinical decision support:
           - Overview: insight/insight.md
           - Clinical operator guide: insight/user-guide.md
           - Developer and API guide: insight/developer-guide.md
       - Public API documentation:
           - Resend Email API: resend/index.md
       - Production troubleshooting:
           - Troubleshooting runbooks: troubleshooting-runbooks.md
       - Contact & Resume: contact.md    