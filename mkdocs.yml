site_name: Faith Njuguna | Technical Writer

theme:
  name: material
  palette:
    primary: indigo
    accent: indigo
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true       

nav:
  - Home: index.md
  - Projects:
       - InSight clinical decision support:
           - Overview: insight/insight.md
           - Process case study: insight/case-study.md
           - Clinical operator guide: insight/user-guide.md
           - Developer and API guide: insight/developer-guide.md
       - Public API documentation:
           - Quickstart: resend/index.md
           - Send batch emails: resend/batch-emails.md
           - API reference: resend/reference.md
           - Process case study: resend/api-case-study.md
           - Error Codes: resend/errors.md
           - Troubleshooting: resend/troubleshooting.md
           - Process case study: resend/troubleshooting-case-study.md
  - Contact & Resume: contact.md   